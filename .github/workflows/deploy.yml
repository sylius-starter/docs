name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by the sylius-starter/sylius-starter monorepo when its docs/ change.
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout the documentation
        uses: actions/checkout@v7
        with:
          repository: sylius-starter/sylius-starter
          path: .monorepo
          sparse-checkout: docs
      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          DOCS_DIR: .monorepo/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
